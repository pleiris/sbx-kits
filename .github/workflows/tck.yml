name: Kit TCK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-kits:
    runs-on: ubuntu-latest
    outputs:
      kits: ${{ steps.collect.outputs.kits }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - id: collect
        name: Collect kit directories
        run: |
          kits=$(for spec in */spec.yaml */spec.yml; do
            [ -f "$spec" ] && dirname "$spec"
          done | sort -u | jq -R . | jq -sc .)
          if [ "$kits" = "[]" ]; then
            echo "No kits found" >&2
            exit 1
          fi
          echo "kits=$kits" >> "$GITHUB_OUTPUT"

  test-kit:
    needs: detect-kits
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJSON(needs.detect-kits.outputs.kits) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test ${{ matrix.kit }}
        run: ./scripts/test-kit.sh "${{ matrix.kit }}" -timeout 30m
